<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Icy Cyan & Cobalt Blue Gradient -->
    <linearGradient id="c4-grad" x1="120" y1="120" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Playhead Core Gradient -->
    <linearGradient id="c4-playhead-grad" x1="196" y1="188" x2="342" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Subtle Ambient Cyan Glow -->
    <filter id="c4-cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00F5FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Pure Obsidian Jet-Black Canvas with Squircle Radius -->
  <rect width="512" height="512" rx="116" fill="#000000"/>
  <!-- Subtle Outer Stator Rim -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#151926" stroke-width="2.5"/>

  <!-- Concept 4: Acoustic Turbine (95% Scale) -->
  <g transform="matrix(0.95 0 0 0.95 12.8 12.8)">
    <!-- Outer Subwoofer Stator Ring Track -->
    <circle cx="256" cy="256" r="142" fill="none" stroke="#151926" stroke-width="18"/>

    <!-- Acoustic Turbine Blade Arcs (Icy Cyan to Cobalt Blue) with Ambient Glow -->
    <!-- Blade Arc 1: Forward Power Arc (Top-Right to Bottom-Right) -->
    <path d="M 304.6,122.5 A 142,142 0 0,1 304.6,389.5" 
          fill="none" 
          stroke="url(#c4-grad)" 
          stroke-width="18" 
          stroke-linecap="round"
          filter="url(#c4-cyan-glow)"/>

    <!-- Blade Arc 2: Lower Resonance Arc -->
    <path d="M 207.4,389.5 A 142,142 0 0,1 116.2,280.7" 
          fill="none" 
          stroke="url(#c4-grad)" 
          stroke-width="18" 
          stroke-linecap="round"
          filter="url(#c4-cyan-glow)"/>

    <!-- Blade Arc 3: Upper Resonance Arc -->
    <path d="M 116.2,231.3 A 142,142 0 0,1 207.4,122.5" 
          fill="none" 
          stroke="url(#c4-grad)" 
          stroke-width="18" 
          stroke-linecap="round"
          filter="url(#c4-cyan-glow)"/>

    <!-- Aperture Calibration Tick Marks -->
    <line x1="256" y1="86" x2="256" y2="104" stroke="#00F5FF" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="408" x2="256" y2="426" stroke="#00F5FF" stroke-width="4" stroke-linecap="round"/>
    <line x1="86" y1="256" x2="104" y2="256" stroke="#00F5FF" stroke-width="4" stroke-linecap="round"/>

    <!-- Optical Diamond Playhead: Deep Black Shadow Base -->
    <path d="M 220,188 L 332,250 C 342,256 342,260 332,266 L 220,328 C 206,336 196,328 196,314 L 196,202 C 196,188 206,180 220,188 Z" 
          fill="#000000" 
          stroke="#000000" 
          stroke-width="10" 
          stroke-linejoin="round"/>

    <!-- Optical Diamond Playhead: Solid Icy Cyan & Cobalt Blue Gradient Core -->
    <path d="M 220,188 L 332,250 C 342,256 342,260 332,266 L 220,328 C 206,336 196,328 196,314 L 196,202 C 196,188 206,180 220,188 Z" 
          fill="url(#c4-playhead-grad)" 
          stroke="rgba(255,255,255,0.5)" 
          stroke-width="2" 
          stroke-linejoin="round"
          filter="url(#c4-cyan-glow)"/>
  </g>
</svg>
