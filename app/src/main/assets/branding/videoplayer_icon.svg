<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Smooth Neon Gradient: Deep Purple -> Magenta -> Coral Pink -> Radiant Orange -->
    <linearGradient id="vm-play-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="65%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="vm-note-grad" x1="20%" y1="90%" x2="80%" y2="10%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Subtle Ambient Glow Filters -->
    <filter id="glow-play" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>

    <filter id="glow-note" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FB923C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Pure Pitch Black AMOLED Background Tile with iOS/Material Squircle Radius -->
  <rect width="512" height="512" rx="116" fill="#000000"/>
  <!-- Subtle Obsidian Inner Rim -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#1A1C23" stroke-width="2.5"/>

  <!-- Scaled & Centered Composition (95% Scale) -->
  <g transform="matrix(0.96 0 0 0.96 10.24 10.24)">
    <!-- Video Play Button Outline -->
    <path d="M 184,168 L 298,244 C 314,254 314,258 298,268 L 184,344 C 168,354 156,346 156,328 L 156,184 C 156,166 168,158 184,168 Z" 
          fill="none" 
          stroke="url(#vm-play-grad)" 
          stroke-width="26" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#glow-play)"/>

    <!-- Musical Eighth Note: Filled Notehead -->
    <circle cx="320" cy="324" r="28" 
            fill="none" 
            stroke="url(#vm-note-grad)" 
            stroke-width="26"
            filter="url(#glow-note)"/>

    <!-- Musical Eighth Note: Vertical Stem & Elegant Drooping Flag -->
    <path d="M 348,324 L 348,176 C 348,160 358,156 370,166 C 386,180 400,202 392,246" 
          fill="none" 
          stroke="url(#vm-note-grad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow-note)"/>
  </g>
</svg>

