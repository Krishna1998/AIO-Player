<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Icy Cyan & Cobalt Blue Gradient (Exact from Concept 4 Preview) -->
    <linearGradient id="g_c4" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Accent Gradient for Calibration Ticks (Exact from Concept 4 Preview) -->
    <linearGradient id="acc_c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>

  <!-- Solid Obsidian Jet-Black Squircle Canvas for App Icon / GitHub README -->
  <rect width="512" height="512" rx="116" fill="#000000"/>

  <g transform="matrix(0.95 0 0 0.95 12.8 12.8)">
    <!-- Concentric Circular Sound Waveguide Frame -->
    <circle cx="256" cy="256" r="142" fill="none" stroke="#151926" stroke-width="20"/>
    <circle cx="256" cy="256" r="142" fill="none" stroke="url(#g_c4)" stroke-width="20" stroke-dasharray="160 30 60 40"/>

    <!-- Centered Sharp Optical Diamond Playhead -->
    <path d="M 220,188 L 332,250 C 342,256 342,260 332,266 L 220,328 C 206,336 196,328 196,314 L 196,202 C 196,188 206,180 220,188 Z" 
          fill="url(#g_c4)" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Aperture Radial Tick Marks -->
    <line x1="256" y1="88" x2="256" y2="104" stroke="url(#acc_c4)" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="408" x2="256" y2="424" stroke="url(#acc_c4)" stroke-width="4" stroke-linecap="round"/>
    <line x1="88" y1="256" x2="104" y2="256" stroke="url(#acc_c4)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
