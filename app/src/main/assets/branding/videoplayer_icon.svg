<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Velvet Void Depth Radial Gradient -->
    <radialGradient id="velvet_void_grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1F1123"/>
      <stop offset="55%" stop-color="#120914"/>
      <stop offset="100%" stop-color="#08040A"/>
    </radialGradient>
    <filter id="violet_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Velvet Void Squircle Canvas for App Icon / GitHub README -->
  <rect width="512" height="512" rx="116" fill="url(#velvet_void_grad)"/>

  <!-- Centered Aura Aperture Disc Emblem (Electric Violet #C084FC on Velvet Void, Scaled 87%) -->
  <g id="aura_aperture_disc" transform="translate(33.28 33.28) scale(0.87)" filter="url(#violet_glow)">
    <!-- Outer Dim Aura Ring (Electric Violet at 40% opacity) -->
    <circle cx="256" cy="256" r="155" fill="none" stroke="#A855F7" stroke-width="11" stroke-opacity="0.40"/>
    <!-- Inner Solid Disc with Negative-Space Playhead Cutout (Electric Violet) -->
    <path fill="#C084FC" fill-rule="evenodd" d="M 256,144 A 112,112 0 1,0 256,368 A 112,112 0 1,0 256,144 Z M 222,191 L 325,256 L 222,321 Z"/>
  </g>
</svg>
