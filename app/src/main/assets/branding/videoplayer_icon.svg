<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Stealth Carbon Depth Radial Gradient -->
    <radialGradient id="stealth_carbon_grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A1E2B"/>
      <stop offset="55%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="magenta_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF007F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Stealth Carbon Squircle Canvas for App Icon / GitHub README -->
  <rect width="512" height="512" rx="116" fill="url(#stealth_carbon_grad)"/>

  <!-- Centered Continuous Ligature VM Emblem (Cyber Magenta) -->
  <g id="continuous_ligature_vm" filter="url(#magenta_glow)">
    <!-- Unbroken Geometric Monoline Ribbon: V into M -->
    <path fill="none" stroke="#FF007F" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" d="M 105,172 L 172,365 L 231,214 L 290,365 L 348,214 L 407,365"/>

    <!-- Directional Playhead nestled in M apex -->
    <polygon fill="#FF007F" points="273,147 323,180 273,214"/>
  </g>
</svg>
