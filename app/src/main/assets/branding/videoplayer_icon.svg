<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Stealth Carbon Depth Radial Gradient -->
    <radialGradient id="stealth_carbon_grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A1E2B"/>
      <stop offset="55%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="lime_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#D4FF00" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Stealth Carbon Squircle Canvas for App Icon / GitHub README -->
  <rect width="512" height="512" rx="116" fill="url(#stealth_carbon_grad)"/>

  <!-- Centered Aura Aperture Disc Emblem (Acid Lime #D4FF00 on Stealth Carbon) -->
  <g id="aura_aperture_disc" filter="url(#lime_glow)">
    <!-- Outer Dim Aura Ring -->
    <circle cx="256" cy="256" r="155" fill="none" stroke="#D4FF00" stroke-width="11" stroke-opacity="0.35"/>
    <!-- Inner Solid Disc with Negative-Space Playhead Cutout -->
    <path fill="#D4FF00" fill-rule="evenodd" d="M 256,144 A 112,112 0 1,0 256,368 A 112,112 0 1,0 256,144 Z M 222,191 L 325,256 L 222,321 Z"/>
  </g>
</svg>
