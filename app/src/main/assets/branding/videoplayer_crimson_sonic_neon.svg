<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Space Obsidian Canvas -->
    <linearGradient id="v2-neon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140810"/>
      <stop offset="50%" stop-color="#0a0308"/>
      <stop offset="100%" stop-color="#030103"/>
    </linearGradient>

    <!-- Radiant Crimson Neon -->
    <linearGradient id="v2-crimson" x1="120" y1="90" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Electric Neon Cyan / Blue for Small Playhead -->
    <linearGradient id="v2-blue" x1="266" y1="226" x2="314" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="v2-crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#ff2a6d" flood-opacity="0.65"/>
    </filter>

    <filter id="v2-blue-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00f5ff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#v2-neon-bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ff2a6d" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Main Composition -->
  <g>
    <!-- Outer Crimson Play Frame (Video) -->
    <path d="M 148 116 C 148 94 172 80 192 91 L 416 226 C 435 238 435 266 416 278 L 192 413 C 172 424 148 410 148 388 Z" fill="url(#v2-crimson)" fill-opacity="0.15" stroke="url(#v2-crimson)" stroke-width="20" stroke-linejoin="round" filter="url(#v2-crimson-glow)"/>

    <!-- Sound Frequency Waveform Bars (Music) in Glowing Crimson -->
    <rect x="188" y="218" width="24" height="76" rx="12" fill="#ff2a6d" opacity="0.6"/>
    <rect x="224" y="174" width="24" height="164" rx="12" fill="#ff2a6d" opacity="0.75"/>
    <rect x="332" y="196" width="24" height="120" rx="12" fill="#ff2a6d" opacity="0.75"/>
    <rect x="368" y="238" width="24" height="36" rx="12" fill="#ff2a6d" opacity="0.6"/>

    <!-- Small Electric Blue Play Icon: Exactly Centered at (290, 256) between bars -->
    <g filter="url(#v2-blue-glow)">
      <path d="M 266 235 C 266 227 275 222 282 226 L 310 247 C 317 251 317 261 310 265 L 282 286 C 275 290 266 285 266 277 Z" fill="url(#v2-blue)" stroke="#e0f2fe" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
