<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Radiant Crimson Neon -->
    <linearGradient id="v3-crimson" x1="120" y1="90" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Electric Neon Cyan / Blue for Bold Playhead -->
    <linearGradient id="v3-blue" x1="265" y1="220" x2="330" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="v3-crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff2a6d" flood-opacity="0.8"/>
    </filter>

    <filter id="v3-blue-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00f5ff" flood-opacity="1.0"/>
    </filter>
  </defs>

  <!-- Solid Obsidian Jet-Black Canvas -->
  <rect width="512" height="512" rx="112" fill="#000000"/>

  <!-- Main Composition -->
  <g>
    <!-- Outer Crimson Play Frame (Video) with Deep Hollow Interior -->
    <path d="M 148 116 C 148 94 172 80 192 91 L 416 226 C 435 238 435 266 416 278 L 192 413 C 172 424 148 410 148 388 Z" fill="none" stroke="url(#v3-crimson)" stroke-width="22" stroke-linejoin="round" filter="url(#v3-crimson-glow)"/>

    <!-- Specular Highlight along outer frame -->
    <path d="M 148 116 C 148 94 172 80 192 91 L 416 226 C 435 238 435 266 416 278 L 192 413 C 172 424 148 410 148 388 Z" fill="none" stroke="#fff1f2" stroke-width="2.5" stroke-opacity="0.45" stroke-linejoin="round"/>

    <!-- Sound Frequency Waveform Bars (Music) in High-Intensity Crimson -->
    <!-- Bar 1 (left) -->
    <rect x="192" y="221" width="22" height="70" rx="11" fill="#ff2a6d" opacity="0.65"/>
    <!-- Bar 2 (tall left) -->
    <rect x="228" y="181" width="22" height="150" rx="11" fill="#ff2a6d" opacity="0.85"/>
    <!-- Bar 3 (medium right) -->
    <rect x="345" y="206" width="22" height="100" rx="11" fill="#ff2a6d" opacity="0.85"/>
    <!-- Bar 4 (short right) -->
    <rect x="381" y="236" width="22" height="40" rx="11" fill="#ff2a6d" opacity="0.65"/>

    <!-- Bold, Clear Center-Core Electric Blue Playhead with Intense Cyan Aura -->
    <g filter="url(#v3-blue-glow)">
      <path d="M 265 231 C 265 221 276 215 284 220 L 322 245 C 330 250 330 262 322 267 L 284 292 C 276 297 265 291 265 281 Z" fill="url(#v3-blue)" stroke="#f0f9ff" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
